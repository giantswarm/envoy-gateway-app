# Global settings
global:
  # If set, these take highest precedence and change envoyGateway, envoyProxy, and ratelimit's container registry and pull secrets.
  # -- Global override for image registry
  imageRegistry: "gsoci.azurecr.io"
  # -- Global override for image pull secrets
  imagePullSecrets: []

  # If set, these override image-specific values: useful when installing the chart in a private registry environment.
  # Override image-specific values directly if a global override is not desired.
  images:
    envoyGateway:
      # -- Full image for the Envoy Gateway control plane Deployment installed by this chart.
      image: gsoci.azurecr.io/giantswarm/envoyproxy-gateway:v1.9.3
      # -- Image pull policy for the Envoy Gateway control plane Deployment.
      # Default behavior: latest images will be Always else IfNotPresent.
      pullPolicy: IfNotPresent
      # -- Pull secrets for the Envoy Gateway control plane Deployment.
      pullSecrets: []
    ratelimit:
      # This is the full image name including the hub, repo, and tag.
      image: "gsoci.azurecr.io/giantswarm/envoyproxy-ratelimit:5ae0682e"
      # Specify image pull policy if default behavior isn't desired.
      # Default behavior: latest images will be Always else IfNotPresent.
      pullPolicy: IfNotPresent
      # List of secrets in the same namespace of the component that can be used to pull images from private repositories.
      pullSecrets: []
    envoyProxy:
      # -- Full image for the managed Envoy Proxy data plane.
      # This updates the generated `envoyProxy` config and does not change the `envoy-gateway`
      # control plane Deployment image. If not specified, the default image built into
      # `envoy-gateway` is used.
      image: "gsoci.azurecr.io/giantswarm/envoy:distroless-v1.39.6"
      # -- Image pull policy for the managed Envoy Proxy data plane.
      # Default behavior: IfNotPresent.
      pullPolicy: IfNotPresent
      # -- Pull secrets for the managed Envoy Proxy data plane.
      pullSecrets: []

# -- Labels to apply to all resources
commonLabels: {}  # @schema additionalProperties: true

serviceType: managed

# -- Override the chart name.
nameOverride: ""

# -- Override the full name of the chart resources.
fullnameOverride: ""

podDisruptionBudget:
  minAvailable: 1  # @schema type: [integer, string, null]
  maxUnavailable: null  # @schema type: [integer, string, null]
  unhealthyPodEvictionPolicy: AlwaysAllow

deployment:
  annotations: {}  # @schema additionalProperties: true
  envoyGateway:
    image:
      # if both this and global.imageRegistry are specified, this has to include both registry and repository explicitly, eg gsoci.azurecr.io/giantswarm/envoyproxy-gateway
      repository: ""
      tag: ""
    imagePullPolicy: ""
    imagePullSecrets: []
    # -- Additional environment variables for the envoy-gateway container.
    extraEnv: []
    resources:  # @schema skipProperties: true; additionalProperties: true
      limits:
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi
    securityContext:  # @schema skipProperties: true; additionalProperties: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsGroup: 65532
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    # -- Volume source for the Wasm module cache mounted at /var/lib/eg/wasm. Defaults to an emptyDir when left empty.
    # Example: persist the Wasm module cache across controller restarts by backing it with a PersistentVolumeClaim:
    #   wasmCacheVolume:
    #     persistentVolumeClaim:
    #       claimName: envoy-gateway-wasm-cache
    strategy: {}  # @schema additionalProperties: true
    wasmCacheVolume: {}  # @schema additionalProperties: true
    # Kubernetes best practice for controllers: use a startupProbe with a generous
    # failure threshold to avoid premature liveness/readiness failures during initialization.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-startup-probes
    startupProbe:  # @schema skipProperties: true; additionalProperties: true
      httpGet:
        path: /healthz
        port: 8081
      failureThreshold: 30
      periodSeconds: 1
      successThreshold: 1
      timeoutSeconds: 1
    livenessProbe:  # @schema skipProperties: true; additionalProperties: true
      httpGet:
        path: /healthz
        port: 8081
      periodSeconds: 20
      successThreshold: 1
      timeoutSeconds: 1
    readinessProbe:  # @schema skipProperties: true; additionalProperties: true
      httpGet:
        path: /readyz
        port: 8081
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 1
  ports:  # @schema item: object; itemProperties: {}; itemRef: schemas/object.json
    - name: grpc
      port: 18000
      targetPort: 18000
    - name: ratelimit
      port: 18001
      targetPort: 18001
    - name: wasm
      port: 18002
      targetPort: 18002
    - name: metrics
      port: 19001
      targetPort: 19001
  priorityClassName: giantswarm-critical  # @schema type: [string, null]
  replicas: 2
  pod:
    affinity: {}  # @schema additionalProperties: true
    annotations:  # @schema additionalProperties: true
      prometheus.io/scrape: 'true'
      prometheus.io/port: '19001'
    labels: {}  # @schema additionalProperties: true
    topologySpreadConstraints:  # @schema item: object; itemProperties: {}; itemRef: schemas/object.json
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: envoy-gateway
    tolerations: []
    nodeSelector: {}  # @schema additionalProperties: true
    # Additional volumeMounts on the deployment definition.
    extraVolumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true
    # Additional volumes on the deployment definition.
    extraVolumes: []
    # - name: foo
    #   configMap:
    #     name: myconfigmap
    securityContext:  # @schema skipProperties: true; additionalProperties: true
      runAsNonRoot: true
      runAsGroup: 65532
      runAsUser: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

service:
  # If set to PreferClose, the Envoy fleet will prioritize connecting to the Envoy Gateway pods that are topologically closest to them.
  trafficDistribution: ""
  annotations: {}  # @schema additionalProperties: true
  # -- Service type. Can be set to LoadBalancer with specific IP, e.g.:
  # type: LoadBalancer
  # loadBalancerIP: 10.236.90.20
  type: "ClusterIP"
  # -- Load balancer IP, used when `type` is LoadBalancer.
  loadBalancerIP: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  metrics:  # @schema item: object; itemProperties: {}; itemRef: schemas/object.json
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior: {}  # @schema additionalProperties: true

config:
# -- EnvoyGateway configuration. Visit https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway to view all options.
  envoyGateway:  # @schema skipProperties: true; additionalProperties: true
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
    logging:
      level:
        default: info
    extensionApis: {}

createNamespace: false

# -- Override the namespace for resources deployed by the chart.
# Defaults to the release namespace.
namespaceOverride: ""

kubernetesClusterDomain: cluster.local

# -- Certgen is used to generate the certificates required by EnvoyGateway. If you want to construct a custom certificate, you can generate a custom certificate through Cert-Manager before installing EnvoyGateway. Certgen will not overwrite the custom certificate. Please do not manually modify `values.yaml` to disable certgen, it may cause EnvoyGateway OIDC,OAuth2,etc. to not work as expected.
certgen:
  job:
    annotations: {}  # @schema additionalProperties: true
    args: []
    pod:
      annotations: {}  # @schema additionalProperties: true
      labels: {}  # @schema additionalProperties: true
      securityContext:  # @schema skipProperties: true; additionalProperties: true
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    resources:  # @schema skipProperties: true; additionalProperties: true
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 500Mi
    affinity: {}  # @schema additionalProperties: true
    tolerations: []
    nodeSelector: {}  # @schema additionalProperties: true
    ttlSecondsAfterFinished: 30
    securityContext:  # @schema skipProperties: true; additionalProperties: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsGroup: 65532
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
  rbac:
    annotations: {}  # @schema additionalProperties: true
    labels: {}  # @schema additionalProperties: true

topologyInjector:
  enabled: true
  annotations: {}  # @schema additionalProperties: true

ciliumNetworkPolicy:
  # -- Allow envoy-gateway control plane pods to communicate with the outside world. This can be required in certain cases with SecurityPolicies trying to contact external providers for additional OIDC or JWT configuration.
  controlPlaneAllowWorld: false

# Backend API Configuration
# WARNING: Enables routing to arbitrary endpoints including localhost.
# This feature has significant security implications. Consider enabling
# kyvernoPolicies.backend when using in production.
# See: https://gateway.envoyproxy.io/docs/tasks/traffic/backend/
backend:
  # -- Enable Backend extension API (disabled by default for security)
  enabled: false

# Kyverno policies for securing Envoy Gateway extension APIs
# Requires Kyverno (https://kyverno.io) to be installed in the cluster
kyvernoPolicies:
  backend:
    # -- Enable Kyverno policies to restrict Backend resource creation
    enabled: true
    # -- Validation failure action: Enforce (block) or Audit (warn only)
    validationFailureAction: Enforce
    # -- Block access to Envoy admin port (19000)
    denyAdminPort: true
    # -- Block access to cloud metadata service (169.254.169.254)
    denyMetadataService: true
    # -- Restrict DynamicResolver type to specific namespaces (empty = deny all)
    allowedDynamicResolverNamespaces: []

crds:
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/envoy-gateway-crds
