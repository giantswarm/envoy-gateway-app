apps:
  gatewayApiCrds:
    # Envoy Gateway 1.9 requires Gateway API v1.6 CRDs; 1.9.1 ships
    # gateway-api v1.6.1. Do NOT pin back to 1.9.0: that version renders
    # ~1.19MB of CRD manifests straight into templates/, so app-operator
    # cannot store the Helm release and the install dies with
    #   Secret "sh.helm.release.v1.gateway-api-crds.v1" is invalid:
    #   data: Too long: may not be more than 1048576 bytes
    # 1.9.1 applies the CRDs via a gateway-api-crds-installer Job instead, so
    # the release holds only ~9.5KB. envoy-gateway dependsOn gateway-api-crds,
    # so a failure here blocks the whole bundle.
    version: 1.9.1
  gatewayApiConfig:
    enabled: true
    userConfig:
      configMap:
        values: |
          gateways:
            default:
              # The chart defaults tlsIssuer.enabled to true, which renders an
              # ACME Issuer whose only solver is http01.gatewayHTTPRoute — and
              # that solver needs cert-manager's ExperimentalGatewayAPISupport
              # (enableGatewayAPI), which we deliberately do NOT enable because
              # it crashloops the controller until the Gateway API CRDs exist.
              # Nothing references this Issuer: the gateway's HTTPS Certificate
              # below is issued by the cluster's letsencrypt-giantswarm
              # ClusterIssuer over DNS-01. Disabling it leaves the Certificate
              # byte-identical and removes the last dependency on the flag.
              tlsIssuer:
                enabled: false
              backendTrafficPolicy:
                circuitBreaker:
                  maxConnections: 8192
                  maxPendingRequests: 8192
                  maxParallelRequests: 8192
                  maxParallelRetries: 1024
              envoyProxy:
                enabled: true
              allowedListeners:
                enabled: true
                namespaces:
                  from: All
              listeners:
                http:
                  httpsRedirectEnabled: true
                  allowedRoutes:
                    namespaces:
                      from: All
                https:
                  subdomains:
                    - onlineboutique
                  certificate:
                    issuer:
                      kind: ClusterIssuer
                      name: letsencrypt-giantswarm
