# NOTE: do NOT add global.apps.certManager.values...enableGatewayAPI here.
# cert-manager's controller exits 1 when ExperimentalGatewayAPISupport is on
# but the Gateway API CRDs are absent — they only arrive with
# gateway-api-bundle, installed after BeforeSuite's HelmRelease gate. That
# deadlock killed the perf runs on 2026-09-01 and 2026-09-02. All
# Certificates here are explicit cert-manager.io/v1 resources using DNS-01.
global:
  connectivity:
    dns:
      wildcardCnameTarget: gateway
    certManager:
      useDnsChallenges: true
  nodePools:
    def00:
      minSize: 5
      maxSize: 5
